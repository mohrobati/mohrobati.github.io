---
layout: default
---

<article class="post">

<header class="post__header">
    <h1 class="post__title">{{ page.title }}</h1>
    <p class="post__date">{{ page.date | date: "%B %d, %Y" }}</p>
    {% if page.tags %}
    <ul class="post__tags">
        {% for tag in page.tags %}
        <li class="post__tag">{{ tag }}</li>
        {% endfor %}
    </ul>
    {% endif %}
</header>

<div class="post__content">
{{ content }}
</div>

</article>
